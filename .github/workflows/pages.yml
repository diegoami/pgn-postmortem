name: Pages

# Publishes the project's demo (ROADMAP.md, F-12) as one Pages artifact:
# - the root is the library's site of the five classic games, built from the
#   committed analysis in examples/site/analyzed/ (this workflow never runs
#   Stockfish);
# - /markdown/ is the Markdown pipeline's example output (examples/docs/),
#   built with the same Jekyll setup Pages itself uses, since branch-based
#   Pages can only serve / or /docs.
# A library change redeploys the demo, so it always shows the library as it
# is on main.
on:
  push:
    branches: [main]
    paths:
      - "examples/docs/**"
      - "examples/site/**"
      - "pgn_postmortem/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Scoped by ref, so a workflow_dispatch run on a branch neither cancels a
# deploy from main nor is cancelled by one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      # First, so that _site/ is created by this job's user: the Jekyll step
      # below is a Docker action running as root, and a directory it created
      # might not be writable here. No --player: the demo has no quiz page.
      - name: Build the library's site (the root)
        run: |
          pip install -r requirements.txt .
          pgn-postmortem site examples/site/analyzed --title "pgn-postmortem demo — five classic games" --site-key pgn-postmortem-demo --out _site
      - id: pages
        uses: actions/configure-pages@v5
      # Kept out of examples/docs/ itself: that directory is regenerated by
      # publish_games.py and compared byte for byte by the golden-file test.
      # parse_block_html renders the Markdown inside the pages' <details>
      # blocks, which kramdown otherwise leaves as raw text. Jekyll rewrites
      # the pages' relative links into root-relative ones under the baseurl,
      # so the baseurl is the Pages base path plus /markdown.
      - name: Stage the Markdown demo (/markdown/)
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          cp -r examples/docs _site_src
          cat > _site_src/_config.yml <<'YAML'
          title: pgn-postmortem
          description: Example output - Stockfish post-mortems of five classic games
          kramdown:
            parse_block_html: true
          YAML
          echo "baseurl: \"${BASE_PATH}/markdown\"" >> _site_src/_config.yml
          cat _site_src/_config.yml
      - uses: actions/jekyll-build-pages@v1
        with:
          source: _site_src
          destination: _site/markdown
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    # The github-pages environment deploys only from main; on a branch the
    # build is checked and nothing is deployed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
