name: Pages

# Publishes the bundled example output (examples/docs/) as the project's
# demo site. Branch-based Pages can only serve / or /docs, so this builds
# the directory with the same Jekyll setup Pages itself uses.
on:
  push:
    branches: [main]
    paths: ["examples/docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Kept out of examples/docs/ itself: that directory is regenerated by
      # publish_games.py and compared byte for byte by the golden-file test.
      # parse_block_html renders the Markdown inside the pages' <details>
      # blocks, which kramdown otherwise leaves as raw text.
      - name: Stage site
        run: |
          cp -r examples/docs _site_src
          cat > _site_src/_config.yml <<'YAML'
          title: pgn-postmortem
          description: Example output - Stockfish post-mortems of five classic games
          kramdown:
            parse_block_html: true
          YAML
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: _site_src
          destination: _site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
