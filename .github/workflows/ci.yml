name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: pip install -r requirements-dev.txt -e .
      - run: ruff check .
      - run: pytest -v
      # The package ships the reading-history script (ROADMAP.md, F-8). The editable install above reads it
      # from the source tree, so only a built wheel shows a missing package-data declaration. Offline:
      # no build isolation, with the setuptools pinned in requirements-dev.txt.
      - name: Check that the wheel ships the reading-history script
        if: matrix.python-version == '3.13'
        run: |
          pip wheel --no-deps --no-build-isolation -w dist .
          python -m zipfile -l dist/pgn_postmortem-*.whl | grep -F pgn_postmortem/static/history.js
      - uses: actions/setup-node@v4
        if: matrix.python-version == '3.13'
        with:
          node-version: "22"
      - name: The script gate
        if: matrix.python-version == '3.13'
        run: node --test 'tests/js/*.test.mjs'
